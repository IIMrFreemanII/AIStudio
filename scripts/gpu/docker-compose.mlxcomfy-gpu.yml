# MLXComfyUI's own GPU server (Wan 2.2, FLUX.1 dev; server/gpu) behind Caddy's bearer-token gate.
# Started by scripts/bootstrap-gpu-server.sh mlxcomfy-gpu.
services:
  app:
    build:
      context: ../../server/gpu
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${DATA_DIR}/models:/models
      - ${DATA_DIR}/data:/data
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  gate:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      API_TOKEN: ${API_TOKEN}
      UPSTREAM: app:8189
    ports:
      - ${PUBLISH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  caddy-data:
